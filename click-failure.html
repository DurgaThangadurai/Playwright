<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playwright Click Failure Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f4f6f8;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d4f80;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .popup {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 350px;
    }

    .popup button {
      background: green;
      margin-top: 15px;
    }

    .success {
      color: green;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Order Form</h1>

    <p>Complete the form and click Submit.</p>

    <label>Name:</label>
    <br />
    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      style="padding: 10px; width: 90%; margin: 10px 0;"
    />

    <br />

    <button id="submitBtn">Submit Order</button>

    <p id="successMessage" class="success"></p>
  </div>

  <!-- Overlay covering the Submit button -->
  <div class="overlay" id="cookieOverlay">
    <div class="popup">
      <h2>Cookie Consent</h2>
      <p>This website uses cookies.</p>
      <button id="acceptCookies">Accept Cookies</button>
    </div>
  </div>

  <script>
    document
      .getElementById("acceptCookies")
      .addEventListener("click", function () {
        document.getElementById("cookieOverlay").style.display = "none";
      });

    document
      .getElementById("submitBtn")
      .addEventListener("click", function () {
        document.getElementById("successMessage").textContent =
          "Order submitted successfully!";
      });
  </script>

</body>
</html>
